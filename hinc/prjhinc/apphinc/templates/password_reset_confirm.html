{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Nueva Contraseña - Hinc</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .fondo-video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <video class="fondo-video" autoplay muted loop>
        <source src="{% static 'img/Hinc.mp4' %}" type="video/mp4">
    </video>

    {% if messages %}
    <div class="absolute top-5 w-3/4 text-center z-50">
        {% for message in messages %}
            <div class="bg-{% if message.tags == 'error' %}red{% else %}green{% endif %}-500 text-white p-4 rounded-lg shadow-lg">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="relative bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl p-8 w-full max-w-md z-10">
        <div class="flex justify-center mb-6">
            <img src="{% static 'img/Hinc.png' %}" alt="Hinc Logo" class="h-16">
        </div>
        
        <h1 class="text-2xl font-bold text-center mb-6">Nueva Contraseña</h1>
        
        <form method="POST" id="reset-form">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_new_password1" class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
                <input type="password" name="new_password1" id="id_new_password1" required 
                       class="mt-1 p-3 w-full border border-gray-300 rounded-lg focus:ring-black focus:border-black">
            </div>

            <div class="mb-6">
                <label for="id_new_password2" class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
                <input type="password" name="new_password2" id="id_new_password2" required 
                       class="mt-1 p-3 w-full border border-gray-300 rounded-lg focus:ring-black focus:border-black">
            </div>

            <button type="submit" class="w-full bg-black text-white p-3 rounded-lg font-semibold hover:bg-gray-800 transition">
                Cambiar Contraseña
            </button>
        </form>

        <script>
            document.getElementById('reset-form').addEventListener('submit', function(e) {
                const password1 = document.getElementById('id_new_password1').value;
                const password2 = document.getElementById('id_new_password2').value;
                
                if (password1 !== password2) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Las contraseñas no coinciden',
                        text: 'Por favor, verifica que ambas contraseñas sean iguales',
                        confirmButtonColor: '#000'
                    });
                }
            });
        </script>
    </div>
</body>
</html>
