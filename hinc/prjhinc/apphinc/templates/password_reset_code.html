{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Verificar Código - Hinc</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .fondo-video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <video class="fondo-video" autoplay muted loop>
        <source src="{% static 'img/Hinc.mp4' %}" type="video/mp4">
    </video>

    {% if messages %}
    <div class="absolute top-5 w-3/4 text-center z-50">
        {% for message in messages %}
            <div class="bg-{{ message.tags }}-500 text-white p-4 rounded-lg shadow-lg">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="relative bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl p-8 w-full max-w-md z-10">
        <div class="flex justify-center mb-6">
            <img src="{% static 'img/Hinc.png' %}" alt="Hinc Logo" class="h-16">
        </div>
        
        <h1 class="text-2xl font-bold text-center mb-6">Verificar Código</h1>
        
        <div class="text-center mb-6">
            <p class="text-gray-700">
                Hemos enviado un código de 6 dígitos a tu correo electrónico.
                Ingresa el código a continuación:
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="id_code" class="block text-sm font-medium text-gray-700">Código de Verificación</label>
                <input type="text" name="code" id="id_code" required maxlength="6"
                       class="mt-1 p-3 w-full border border-gray-300 rounded-lg focus:ring-black focus:border-black text-center text-xl font-mono"
                       placeholder="000000">
            </div>

            <button type="submit" class="w-full bg-black text-white p-3 rounded-lg font-semibold hover:bg-gray-800 transition">
                Verificar Código
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="{% url 'password_reset' %}" class="text-black hover:underline">← Volver atrás</a>
        </div>
    </div>
</body>
</html>
