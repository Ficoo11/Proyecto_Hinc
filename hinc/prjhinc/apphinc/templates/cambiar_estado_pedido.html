<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Estado - Pedido #{{ pedido.id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <!-- Header -->
            <div class="border-b pb-4 mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Cambiar Estado del Pedido</h1>
                <p class="text-gray-600">Pedido #{{ pedido.id }}</p>
            </div>

            <!-- Información del Pedido -->
            <div class="mb-6">
                <p><strong>Cliente:</strong> {{ pedido.usuario.username }}</p>
                <p><strong>Estado Actual:</strong> 
                    <span class="px-2 py-1 rounded text-sm 
                        {% if pedido.estado == 'completado' %}bg-green-100 text-green-800
                        {% elif pedido.estado == 'en_proceso' %}bg-blue-100 text-blue-800
                        {% elif pedido.estado == 'cancelado' %}bg-red-100 text-red-800
                        {% else %}bg-gray-100 text-gray-800{% endif %}">
                        {{ pedido.get_estado_display }}
                    </span>
                </p>
                <p><strong>Total:</strong> ${{ pedido.total }}</p>
            </div>

            <!-- Formulario para cambiar estado -->
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="nuevo_estado" class="block text-sm font-medium text-gray-700 mb-2">
                        Nuevo Estado:
                    </label>
                    <select name="nuevo_estado" id="nuevo_estado" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option value="">Seleccionar estado...</option>
                        <option value="pendiente" {% if pedido.estado == 'pendiente' %}selected{% endif %}>
                            Pendiente
                        </option>
                        <option value="confirmado" {% if pedido.estado == 'confirmado' %}selected{% endif %}>
                            Confirmado
                        </option>
                        <option value="en_proceso" {% if pedido.estado == 'en_proceso' %}selected{% endif %}>
                            En Proceso
                        </option>
                        <option value="enviado" {% if pedido.estado == 'enviado' %}selected{% endif %}>
                            Enviado
                        </option>
                        <option value="completado" {% if pedido.estado == 'completado' %}selected{% endif %}>
                            Completado
                        </option>
                        <option value="cancelado" {% if pedido.estado == 'cancelado' %}selected{% endif %}>
                            Cancelado
                        </option>
                    </select>
                </div>

                <div class="flex gap-3">
                    <button type="submit" 
                            class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-2 px-4 rounded-md transition duration-200">
                        Actualizar Estado
                    </button>
                    <a href="{% url 'detalle_pedido' pedido.id %}"
                       class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-md text-center transition duration-200">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
