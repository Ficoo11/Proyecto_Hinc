{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Contraseña Actualizada - Hinc</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .fondo-video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <video class="fondo-video" autoplay muted loop>
        <source src="{% static 'img/Hinc.mp4' %}" type="video/mp4">
    </video>

    <div class="relative bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl p-8 w-full max-w-md z-10">
        <div class="flex justify-center mb-6">
            <img src="{% static 'img/Hinc.png' %}" alt="Hinc Logo" class="h-16">
        </div>
        
        <h1 class="text-2xl font-bold text-center mb-6 text-green-600">¡Contraseña Actualizada!</h1>
        
        <div class="text-center mb-6">
            <p class="text-gray-700">
                Tu contraseña ha sido cambiada exitosamente. Ahora puedes iniciar sesión con tu nueva contraseña.
            </p>
        </div>

        <div class="text-center">
            <a href="{% url 'login' %}" class="inline-block bg-black text-white p-3 rounded-lg font-semibold hover:bg-gray-800 transition">
                Iniciar Sesión
            </a>
        </div>
    </div>
</body>
</html>
