<!-- templates/paneladmin/dashboard.html (modified) -->
<div>
    <h2 class="text-2xl font-bold text-black mb-6">Dashboard</h2>
    <div class="grid grid-cols-2 gap-6 mb-6">
        <!-- Estadísticas (2 arriba) -->
        <div class="p-6 bg-gray-100 rounded-md shadow-md hover:shadow-lg transition-shadow duration-300">
            <h4 class="font-semibold text-gray-800 text-lg">Usuarios Activos</h4>
            <p class="text-4xl text-black mt-2">{{ users|length }}</p>
        </div>
        <div class="p-6 bg-gray-100 rounded-md shadow-md hover:shadow-lg transition-shadow duration-300">
            <h4 class="font-semibold text-gray-800 text-lg">Productos</h4>
            <p class="text-4xl text-black mt-2">{{ productos|length }}</p>
        </div>
        <!-- Estadísticas (2 abajo) -->
        <div class="p-6 bg-gray-100 rounded-md shadow-md hover:shadow-lg transition-shadow duration-300">
            <h4 class="font-semibold text-gray-800 text-lg">Categorías</h4>
            <p class="text-4xl text-black mt-2">{{ categorias|length }}</p>
        </div>
        <div class="p-6 bg-gray-100 rounded-md shadow-md hover:shadow-lg transition-shadow duration-300">
            <h4 class="font-semibold text-gray-800 text-lg">Ventas Totales</h4>
            <p class="text-4xl text-black mt-2">$0.00</p> <!-- Placeholder, necesitarías un modelo de ventas -->
        </div>
    </div>
</div>
